name: test-and-build

on:
  push: {}

jobs:
  test:
    defaults:
      run:
        shell: sh

    env:
      CGO_ENABLED: 0
      GOPATH: /go

    runs-on: forgejo

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test code
        run: make test
